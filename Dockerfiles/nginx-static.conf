server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── phidias-manifest.json ────────────────────────────────────────────────
    # Always revalidate: host apps must see the latest deployment state so
    # they resolve the correct hashed filename for their requested channel.
    location = /phidias-manifest.json {
        add_header 'Access-Control-Allow-Origin'  '*'                          always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS'               always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Accept, Content-Type' always;
        add_header 'Cache-Control'                'no-cache'                   always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        try_files $uri =404;
    }

    # ── phidias-wc.js (latest channel, no hash) ──────────────────────────────
    # Hot-swapped on every deploy — must not be cached beyond the current request.
    location = /phidias-wc.js {
        add_header 'Access-Control-Allow-Origin'  '*'                          always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS'               always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Accept, Content-Type' always;
        add_header 'Cache-Control'                'no-cache'                   always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        try_files $uri =404;
    }

    # ── Content-hashed WC bundles (steady / version-tag channels) ────────────
    # Filename pattern: phidias-wc-<tag>.<hash>.js
    #   e.g.  phidias-wc-v1.2.3.BdmVOJHG.js
    #         phidias-wc-steady.BdmVOJHG.js
    # Hash is 8 base62 chars appended by Vite's rollup output.
    # Because the hash encodes content, this URL is immutable: serve with the
    # longest possible TTL so CDN and browsers never re-fetch the same file.
    location ~* "^/phidias-wc-.+\.[a-zA-Z0-9]{8}\.js$" {
        add_header 'Access-Control-Allow-Origin'  '*'                                    always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS'                         always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Accept, Content-Type'         always;
        add_header 'Cache-Control'                'public, max-age=31536000, immutable'  always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        try_files $uri =404;
    }

    # ── Everything else (public assets: HDRI, textures, models, images) ──────
    # No explicit Cache-Control — browser/CDN default behaviour is acceptable
    # for assets that are replaced by content-addressed URLs on change.
    location / {
        add_header 'Access-Control-Allow-Origin'  '*'                          always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS'               always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Accept, Content-Type' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        try_files $uri $uri/ =404;
    }
}
