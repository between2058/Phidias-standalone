cleanup:
  <<: [*job-cleanup-deployment-def, *job-phidias-test-vars-def]
  environment:
    name: test/$CI_COMMIT_REF_NAME
    action: stop
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merged"'
      when: on_success
      variables:
        BRANCH_NAME: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH != "master" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
